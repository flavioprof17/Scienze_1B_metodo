* { box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; }
:root { --barra: 76px; }
body { margin: 0; font-family: "ER", "Atkinson", Verdana, Arial, sans-serif; color: #000; background: #fff; line-height: 1.3; overflow: hidden; }
b, strong, .titolo, .testa { font-weight: normal; -webkit-text-stroke: .5px currentColor; }
p { margin: 0; }

body.f-atkinson b, body.f-atkinson strong, body.f-atkinson .titolo, body.f-atkinson .testa { font-weight: 700; -webkit-text-stroke: 0; }

/* foglio */
#vista { position: absolute; inset: 0 0 var(--barra) 0; overflow: hidden; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
#foglio.anima { transition: transform .35s ease-out; }
@media (prefers-reduced-motion: reduce) { #foglio.anima { transition: none; } }
#lente { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 2; }
#lente button { font: inherit; font-size: 15px; min-width: 40px; height: 40px; padding: 0 8px; background: #fff; color: #000; border: 1px solid #000; cursor: pointer; touch-action: manipulation; }
body.stretto #lente { display: none; }
#foglio { position: absolute; top: 0; left: 0; width: 1680px; padding: 26px 30px; transform-origin: 0 0; }
#linee { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#linee path { fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* tronco */
#tronco { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 660px; margin: 0 auto; text-align: center; }
.titolo { display: flex; align-items: center; gap: 14px; font-size: 46px; -webkit-text-stroke: .9px currentColor; }
.titolo svg { width: 84px; height: 63px; }
.chiedi { font-size: 25px; }
.frase { font-size: 25px; }
.ponte { font-size: 25px; padding: 0 14px; }

/* rami */
#rami { display: grid; grid-template-columns: 5fr 4fr; gap: 44px; margin-top: -71px; }
.scatola { width: 300px; height: 104px; margin: 0 auto; border: 2px solid #000; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 19px; }
.scatola strong { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
.piccola { align-self: center; padding: 0 10px; min-width: 190px; }
.gruppi { display: grid; gap: 14px; margin: 52px auto 0; max-width: var(--largo, none); }
.testa { min-height: 66px; display: flex; align-items: flex-end; padding-bottom: 5px; border-bottom: 1px solid #000; font-size: 15px; letter-spacing: 1.6px; text-transform: uppercase; }
.voci { list-style: none; margin: 0; padding: 8px 0 0 22px; }
.voce { padding: 3px 0 7px; font-size: 18px; }
.voce svg { display: block; width: 84px; height: 63px; margin-bottom: 2px; }
.voce.grande svg { width: 130px; height: 98px; }
.sotto { margin: 0; padding: 4px 0 0 20px; list-style: none; }
.sotto .voce svg { width: 76px; height: 57px; }
.voci.due { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; grid-auto-flow: column; }

/* disegni */
.ill { overflow: visible; }
.ill * { fill: none; stroke: #000; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
.ill .f { fill: #000; stroke: none; }
.ill .b { fill: #fff; }
.ill .h { stroke-width: .8; }

/* impostazioni: stampatello e colori */
body.maiuscolo #foglio { text-transform: uppercase; }
body.maiuscolo .voce { font-size: 15px; }
body.largo .voce { font-size: 16px; }
body.largo .testa { font-size: 13.5px; letter-spacing: 1px; }
body.largo .chiedi, body.largo .frase, body.largo .ponte { font-size: 22px; }
body.maiuscolo.largo .voce { font-size: 13px; }
body.maiuscolo.largo .testa { font-size: 13px; letter-spacing: .6px; }
.ill .k { display: none; mix-blend-mode: multiply; }
body.colori .ill .k { display: inline; }
body.colori .testa { color: var(--col); border-bottom: 2px solid var(--col); }
body.colori .scatola { color: var(--col); border-color: var(--col); }
@media print { body.colori * { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }

/* stati */
.nodo { visibility: hidden; position: relative; }
.nodo.visto { visibility: visible; }
.nodo.vuoto { visibility: visible; outline: 1px dashed #000; outline-offset: -1px; }
.nodo.vuoto > * { visibility: hidden; }
.testa.vuoto { background: #fff; }
.nodo.vuoto.aiuto::before { content: attr(data-i); position: absolute; left: 8px; right: 6px; top: 50%; transform: translateY(-50%); font-size: 16px; line-height: 1.25; white-space: pre-wrap; visibility: visible; }
.voce.vuoto.aiuto::before { top: auto; bottom: 6px; transform: none; }
.nodo.vuoto.immagine > svg { visibility: visible; }
#indizio { position: absolute; right: 20px; bottom: calc(var(--barra) + 12px); max-width: 620px; background: #fff; border: 1.5px solid #000; padding: 10px 14px; font-size: 18px; z-index: 4; }
#indizio[hidden] { display: none; }
.scatola.vuoto.aiuto:not(:has(.vuoto))::before { text-align: center; }
.nodo.corrente .et { text-decoration: underline 3px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
.scatola.nodo.corrente { border-width: 4px; }
.titolo.nodo.corrente svg + .et, .titolo.nodo.corrente .et { text-decoration-thickness: 4px; }

#linee path { visibility: hidden; }
#linee path.visto { visibility: visible; }

@keyframes traccia { 0% { stroke-dashoffset: 1; opacity: 0; } 2% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
@keyframes appare { from { opacity: 0; } to { opacity: 1; } }
.nuovo .et { animation: appare .45s ease-out both; }
.nuovo .ill *:not(.f) { stroke-dasharray: 1; animation: traccia 1s ease-in-out both; }
.nuovo .ill .f { animation: appare .35s .8s ease-out both; }
.nuovo.scatola { animation: appare .4s ease-out both; }
#linee path.nuovo { stroke-dasharray: 1; animation: traccia .55s ease-in-out both; }
@media (prefers-reduced-motion: reduce) {
  .nuovo .et, .nuovo .ill *, .nuovo .ill .f, .nuovo.scatola, #linee path.nuovo { animation: none; stroke-dasharray: none; }
}

/* barra */
#barra { position: absolute; left: 0; right: 0; bottom: 0; min-height: 76px; border-top: 1.5px solid #000; background: #fff; z-index: 3; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; padding: 6px 20px calc(6px + env(safe-area-inset-bottom)); font-size: 16px; }
#modi { display: flex; gap: 18px; }
#modi button { border: 0; background: none; padding: 6px 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 3px solid transparent; }
#modi button[aria-pressed="true"] { font-weight: bold; border-bottom-color: #000; }
#messaggio { font-size: 19px; text-align: center; }
#messaggio small { display: block; font-size: 13px; }
#comandi { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
#comandi button { font: inherit; color: #000; background: #fff; border: 1px solid #000; padding: 9px 16px; cursor: pointer; }
#comandi button.primo { background: #000; color: #fff; }
button:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
#comandi button:disabled { border-color: #bbb; color: #999; cursor: default; }

/* pannello impostazioni */
#apri { margin-left: 6px; }
#pannello { position: absolute; left: 20px; bottom: calc(var(--barra) + 12px); max-height: calc(100% - var(--barra) - 24px); overflow: auto; width: 340px; max-width: calc(100vw - 32px); background: #fff; border: 1.5px solid #000; padding: 14px 18px; font-size: 16px; z-index: 5; }
#pannello[hidden] { display: none; }
#pannello fieldset { border: 0; border-bottom: 1px solid #bbb; margin: 0; padding: 8px 0 12px; }
#pannello fieldset:last-of-type { border-bottom: 0; padding-bottom: 4px; }
#pannello legend { padding: 0; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; }
#pannello label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
#pannello input { accent-color: #000; width: 17px; height: 17px; margin: 0; flex: none; }

/* telefono */
body.stretto #vista { overflow: auto; touch-action: manipulation; }
body.stretto.lazo-attivo.m-stampa #vista { touch-action: none; }
body.stretto #foglio { position: relative; width: 100%; height: auto; padding: 16px 16px 60px; transform: none !important; }
body.stretto #tronco { width: 100%; gap: 26px; }
body.stretto .titolo { font-size: 34px; }
body.stretto .chiedi, body.stretto .frase, body.stretto .ponte { font-size: 20px; }
body.stretto #rami { display: block; margin-top: 26px; }
body.stretto .ramo + .ramo { margin-top: 36px; }
body.stretto .scatola { width: auto; margin-left: 16px; }
body.stretto .gruppi { max-width: none; grid-template-columns: 1fr !important; margin: 16px 0 0 42px; gap: 18px; }
body.stretto .testa { min-height: 0; }
body.stretto .gruppi > div { grid-column: auto !important; }
body.stretto .voci.due { display: block; }
body.stretto #barra { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 16px; }
body.stretto #messaggio { order: -1; flex: 1; font-size: 16px; text-align: left; }
body.stretto #comandi button { flex: 1 1 auto; padding: 10px 6px; }
body.stretto.m-stampa #comandi button { font-size: 13px; padding: 8px 4px; }
body.stretto.m-stampa #comandi .divide { flex: 1 0 100%; width: 100%; height: 0; }
body.stretto.m-stampa #barra { gap: 4px; }
body.stretto:not(.m-stampa) #comandi { flex-wrap: nowrap; gap: 5px; }
body.stretto:not(.m-stampa) #comandi button { font-size: 14px; padding: 9px 3px; }
body.stretto #indizio { left: 16px; right: 16px; max-width: none; font-size: 16px; }
body.stretto #pannello { left: 16px; }
@media (min-width: 600px) {
  body.stretto .voce { font-size: 22px; }
  body.stretto .voce svg { width: 112px; height: 84px; }
  body.stretto .voce.grande svg { width: 170px; height: 128px; }
  body.stretto .sotto .voce svg { width: 96px; height: 72px; }
  body.stretto .testa { font-size: 18px; }
}
@media (pointer: coarse) {
  #comandi button, #modi button { min-height: 44px; touch-action: manipulation; }
  #pannello label { min-height: 44px; }
  #vista { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
}

body.senza-ponte #rami { margin-top: 34px; }
body.senza-ponte .scatola { margin-top: 26px; }

/* pagina stampa: cosa nascondere */
body.m-stampa #vista { cursor: crosshair; user-select: none; -webkit-user-select: none; }
body.m-stampa .par, body.m-stampa #foglio .ill { cursor: pointer; }
@media (hover: hover) {
  body.m-stampa .par:hover { background: #e4e4e4; }
  body.m-stampa .ill:hover { outline: 1px solid #000; }
  body.m-stampa.sezioni [data-colonna]:hover, body.m-stampa.sezioni .scatola:hover { outline: 1px dashed #000; outline-offset: 2px; }
}
@media (max-width: 1300px) {
  body.m-stampa:not(.stretto) #barra { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; }
  body.m-stampa:not(.stretto) #messaggio { order: -1; flex: 1 0 100%; }
}
body.m-stampa .par.oculta { color: #b4b4b4; -webkit-text-stroke: 0; outline: 1px dashed #999; outline-offset: -1px; }
body.m-stampa .ill.oculta { opacity: .16; outline: 1px dashed #000; }
.par.preso, .ill.preso { background: #d0d0d0 !important; outline: 2px solid #000 !important; }
#lazo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
#lazo polygon { fill: rgba(0,0,0,.06); stroke: #000; stroke-width: 1.5; stroke-dasharray: 5 4; }
#lazo[hidden] { display: none; }
body.m-stampa #barra { font-size: 14px; gap: 14px; }
body.m-stampa #messaggio { font-size: 15px; line-height: 1.25; }
body.m-stampa #comandi { gap: 5px; }
body.m-stampa #comandi button { padding: 8px 9px; white-space: nowrap; }
#comandi button[aria-pressed="true"] { background: #000; color: #fff; }
#comandi .divide { width: 8px; }

/* stampa su piu' pagine */
body.pagine #rami { display: block; margin-top: 34px; }
body.pagine .ramo + .ramo { margin-top: 44px; }
body.pagine .gruppi { row-gap: 36px; }
body.stampa.pagine .ramo + .ramo { margin-top: 0; }
.pagina { position: relative; width: 1680px; padding: 26px 30px; overflow: hidden; break-after: page; background: #fff; }
.pagina:last-child { break-after: auto; }
.stacco { height: 8px; }
.pagina .gruppi { margin-top: 30px; }
.pagina #tronco { gap: 20px; }
.pagina .scatola { box-sizing: border-box; width: min(400px, 100%); height: auto; min-height: 72px; padding: 6px 12px; }
.pagina .testa { min-height: 0; }
body.pagine #rami.scaffale { display: flex; gap: 40px; align-items: flex-start; }
.scaffale > .ramo { min-width: 0; }
/* in stampa il disegno sta accanto al testo: le voci occupano meno altezza e i rami si incastrano */
.pagina .voce:has(> svg) { display: flex; align-items: center; gap: 10px; }
.pagina .voce > svg, .pagina .sotto .voce > svg { flex: none; width: 64px; height: 48px; margin: 0; }
.pagina .voce.grande > svg { width: 96px; height: 72px; }
.pagina .linee { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.linee path { fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
body.libro #vista { display: none; }
.continua { font-size: 19px; margin-bottom: 26px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1.5px solid #000; padding-bottom: 5px; }

/* stampa */
@media print {
  html, body { height: auto; overflow: visible; }
  #barra, #pannello, #indizio, #lazo, #lente, noscript { display: none !important; }
  .par.oculta { visibility: hidden; }
  .ill.oculta { visibility: hidden; }
  body.righe .par.oculta { visibility: visible; color: transparent !important; -webkit-text-stroke: 0 !important; outline: 0 !important; border-bottom: 1px solid #000; }
  #vista { position: static; overflow: visible; }
  #foglio { position: relative; }
}

/* ---------- MOTORE ---------- */
const $ = (s, r = document) => r.querySelector(s);
const foglio = $('#foglio'), vista = $('#vista'), linee = $('#linee');
const passi = [], collegamenti = [];
const etichetta = (t) => t.replace(/<[^>]+>/g, '').trim();
/* forma della parola: prima lettera e trattini, per le prime due parole */
const formaDi = (t) => {
  const parole = etichetta(t).split(/\s+/);
  const forma = parole.slice(0, 2).map(p => [...p].map((l, i) => i === 0 || !/\p{L}/u.test(l) ? l : '_').join(' ')).join('   ');
  return forma + (parole.length > 2 ? ' …' : '');
};
const disegno = (nome) => nome ? `<svg class="ill" data-n="${nome}" viewBox="0 0 96 72" aria-hidden="true">${ICONE[nome]}<g class="k">${COLORI[nome] || ''}</g></svg>` : '';

function creaNodo(tag, id, classi, html, testo, colore) {
  const el = document.createElement(tag);
  el.className = 'nodo ' + classi; el.dataset.id = id; el.dataset.i = formaDi(testo); el.innerHTML = html;
  if (colore) el.style.setProperty('--col', colore);
  return el;
}
function aggiungiLinea(tipo, da, a) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('pathLength', '1'); p.dataset.a = a; linee.appendChild(p);
  collegamenti.push({ tipo, da, a, p });
}

/* oltre 9 colonne non ci stanno affiancate: i rami vanno uno sotto l'altro, a righe */
const colonneDi = (r) => r.gruppi.reduce((n, g) => n + (g.colonne || 1), 0);
const lungo = SCHEMA.rami.length !== 2 || SCHEMA.rami.reduce((n, r) => n + colonneDi(r), 0) > 9;
const conPonte = SCHEMA.tronco[SCHEMA.tronco.length - 1].tipo === 'ponte';

function avvolgiParole(el) {
  [...el.childNodes].forEach(n => {
    if (n.nodeType === 1) { avvolgiParole(n); return; }
    if (n.nodeType !== 3) return;
    const pezzi = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(p => {
      if (!p) return;
      if (/^\s+$/.test(p)) { pezzi.append(p); return; }
      const sp = document.createElement('span'); sp.className = 'par'; sp.textContent = p; pezzi.append(sp);
    });
    n.replaceWith(pezzi);
  });
}

function costruisci() {
  const tronco = $('#tronco'), rami = $('#rami');
  rami.style.gridTemplateColumns = SCHEMA.rami.map(r => colonneDi(r) + 'fr').join(' ');
  document.body.classList.toggle('senza-ponte', !conPonte);
  if (STILI_COLORE) document.head.appendChild(Object.assign(document.createElement('style'), { textContent: STILI_COLORE }));
  let prec = null;
  SCHEMA.tronco.forEach(t => {
    const interno = t.tipo === 'titolo' ? `${disegno(t.icona)}<span class="et">${t.testo}</span>` : `<p class="et">${t.testo}</p>`;
    tronco.appendChild(creaNodo('div', t.id, t.tipo, interno, t.testo));
    if (prec) aggiungiLinea('freccia', prec, t.id);
    if (t.conPrecedente) passi[passi.length - 1].ids.push(t.id);
    else passi.push({ ids: [t.id], domanda: t.domanda, indizio: t.indizio });
    prec = t.id;
  });
  const resto = [];
  SCHEMA.rami.forEach(r => {
    const ramo = document.createElement('section'); ramo.className = 'ramo';
    const scatola = creaNodo('div', r.id, 'scatola', `<strong class="et">${r.testo}</strong>`, r.testo, r.colore);
    if (r.nota) scatola.appendChild(creaNodo('span', r.id + '-nota', 'piccola', `<span class="et">${r.nota}</span>`, r.nota));
    ramo.appendChild(scatola);
    aggiungiLinea(conPonte ? 'lato' : 'albero', prec, r.id);
    passi.push({ ids: [r.id], domanda: r.domanda, indizio: r.indizio });
    if (r.nota) passi.push({ ids: [r.id + '-nota'], domanda: r.domandaNota, indizio: r.indizioNota });
    const griglia = document.createElement('div'); griglia.className = 'gruppi';
    griglia.style.gridTemplateColumns = `repeat(${lungo ? Math.min(5, colonneDi(r)) : colonneDi(r)}, 1fr)`;
    if (lungo) griglia.style.setProperty('--largo', Math.min(5, colonneDi(r)) * 330 + 'px');
    r.gruppi.forEach(g => {
      const col = document.createElement('div'); col.dataset.colonna = g.colonne || 1;
      if (g.colonne) col.style.gridColumn = `span ${g.colonne}`;
      col.appendChild(creaNodo('div', g.id, 'testa', `<span class="et">${g.testo}</span>`, g.testo, g.colore));
      aggiungiLinea('albero', r.id, g.id);
      resto.push({ ids: [g.id], domanda: g.domanda, indizio: g.indizio });
      const ul = document.createElement('ul'); ul.className = 'voci' + (g.colonne === 2 ? ' due' : '');
      if (g.colonne === 2) ul.style.gridTemplateRows = `repeat(${Math.ceil(g.voci.length / 2)}, auto)`;
      const ids = [], dopo = [];
      g.voci.forEach((v, i) => {
        const id = v.id || `${g.id}-${i}`;
        const li = creaNodo('li', id, 'voce' + (v.grande ? ' grande' : ''), `${disegno(v.icona)}<span class="et">${v.testo}</span>`, v.testo);
        ul.appendChild(li); ids.push(id); aggiungiLinea('spina', g.id, id);
        if (v.sotto) {
          const su = document.createElement('ul'); su.className = 'sotto';
          const sids = v.sotto.map((s, j) => {
            const sid = `${id}-${j}`;
            su.appendChild(creaNodo('li', sid, 'voce', `${disegno(s.icona)}<span class="et">${s.testo}</span>`, s.testo));
            aggiungiLinea('spina', id, sid);
            return sid;
          });
          ul.appendChild(su);
          dopo.push({ ids: sids, domanda: v.domandaSotto });
        }
      });
      col.appendChild(ul); griglia.appendChild(col);
      if (ids.length) resto.push({ ids, domanda: g.domandaVoci, indizio: g.indizioVoci }, ...dopo);
    });
    ramo.appendChild(griglia); rami.appendChild(ramo);
    passi.push(...resto.splice(0)); /* ogni ramo si completa prima del successivo */
  });
  passi.push(...resto);
  document.querySelectorAll('#foglio .et').forEach(avvolgiParole);
  document.querySelectorAll('.ill *').forEach(e => { if (!e.classList.contains('f') && e.tagName !== 'g' && !e.closest('.k')) e.setAttribute('pathLength', '1'); });
}

/* linee: si ricalcolano dalle posizioni reali, cosi' il foglio si adatta ai contenuti */
let scala = 1, scalaBase = 1;
const cam = { z: 1, x: 0, y: 0 };
const dim = () => ({ W: vista.clientWidth, H: vista.clientHeight, alto: foglio.offsetHeight });
function inquadra(anima) {
  const { W, H, alto } = dim(), s = scalaBase * cam.z, sw = 1680 * s, sh = alto * s;
  cam.x = sw <= W ? (W - sw) / 2 : Math.min(0, Math.max(W - sw, cam.x));
  cam.y = sh <= H ? (H - sh) / 2 : Math.min(0, Math.max(H - sh, cam.y));
  scala = s;
  foglio.classList.toggle('anima', !!anima);
  foglio.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${s})`;
}
function ingrandisci(z, cx, cy, anima) {
  const nuovo = Math.min(5, Math.max(1, z));
  const r = nuovo / cam.z;
  cam.x = cx - (cx - cam.x) * r; cam.y = cy - (cy - cam.y) * r; cam.z = nuovo;
  inquadra(anima);
}
function tuttoIlFoglio(anima) { cam.z = 1; cam.x = 0; cam.y = 0; inquadra(anima); }
let preparato = false;
function adatta() {
  if (preparato) return;
  const stretto = innerWidth < 900;
  document.body.classList.toggle('stretto', stretto);
  document.body.classList.toggle('pagine', lungo && !stretto);
  foglio.classList.remove('anima');
  if (stretto) { scala = 1; foglio.style.transform = ''; }
  else {
    foglio.style.transform = '';
    const { W, H, alto } = dim(), intero = Math.min(W / 1680, H / alto);
    scalaBase = lungo && intero < .55 ? W / 1680 : intero;
    inquadra(false);
  }
  disegnaLinee();
}
/* porta in vista il passo corrente; se richiesto lo avvicina fino a un testo comodo */
function seguiAttivo() {
  if (scelte.segui !== undefined) return scelte.segui;
  return matchMedia('(pointer: coarse)').matches && scalaBase < .8;
}
function mostraPasso(ids) {
  if (document.body.classList.contains('stretto') || !ids.length) return;
  const nodi = ids.map(id => $(`[data-id="${id}"]`)), rr = nodi.map(n => n.getBoundingClientRect()), v = vista.getBoundingClientRect();
  const u = { l: Math.min(...rr.map(r => r.left)) - v.left, r: Math.max(...rr.map(r => r.right)) - v.left, t: Math.min(...rr.map(r => r.top)) - v.top, b: Math.max(...rr.map(r => r.bottom)) - v.top };
  const { W, H } = dim();
  if (seguiAttivo()) {
    const lu = (u.r - u.l) / cam.z, au = (u.b - u.t) / cam.z;
    const z = Math.max(1, Math.min(.9 / scalaBase, W * .9 / lu, H * .9 / au));
    const cx = (u.l + u.r) / 2, cy = (u.t + u.b) / 2, r = z / cam.z;
    cam.x = W / 2 - (cx - cam.x) * r; cam.y = H / 2 - (cy - cam.y) * r; cam.z = z;
    inquadra(true);
  } else if (u.t < 0 || u.b > H || u.l < 0 || u.r > W) {
    cam.x += W / 2 - (u.l + u.r) / 2;
    cam.y += u.b - u.t > H ? 12 - u.t : H / 2 - (u.t + u.b) / 2;
    inquadra(true);
  }
}

function disegnaLinee() {
  tracciaLinee(foglio, scala, document.body.classList.contains('stretto'), document.body.classList.contains('pagine'), (c, d) => c.p.setAttribute('d', d));
}
function tracciaLinee(radice, s, stretto, pagine, scrivi) {
  const base = radice.getBoundingClientRect();
  const rett = (nodo) => {
    const r = nodo.getBoundingClientRect();
    return { l: (r.left - base.left) / s, r: (r.right - base.left) / s, t: (r.top - base.top) / s, b: (r.bottom - base.top) / s, cx: ((r.left + r.right) / 2 - base.left) / s, cy: ((r.top + r.bottom) / 2 - base.top) / s };
  };
  const testoSopra = (nodo) => ($('.et', nodo).getBoundingClientRect().top - base.top) / s;
  const coppie = collegamenti.map(c => {
    const figlio = $(`[data-id="${c.a}"]`, radice);
    if (!figlio) return null;
    const ambito = (c.tipo === 'spina' && figlio.closest('[data-colonna]')) || radice;
    const padre = $(`[data-id="${c.da}"]`, ambito);
    return padre ? { c, padre, figlio, A: rett(padre), B: rett(figlio) } : null;
  }).filter(Boolean);
  const figli = {};
  coppie.forEach(({ c, B }) => { (figli[c.da + c.tipo] = figli[c.da + c.tipo] || []).push(B); });
  coppie.forEach(({ c, figlio, A, B }) => {
    let d;
    const primaRiga = () => Math.min(...figli[c.da + c.tipo].map(f => f.t));
    if (pagine && c.tipo === 'albero' && B.t > primaRiga() + 2) {
      d = `M${A.cx} ${A.b} V${A.b + 14} H14 V${B.t - 12} H${B.cx} V${figlio.matches('.scatola') ? B.t : testoSopra(figlio) - 5}`;
    } else if (pagine && c.tipo === 'lato' && B.t - A.b > 60) {

function avvia(m, sottoinsieme) {

/* A4 orizzontale con margini di 10 mm, in px CSS */
const PAGINA_H = 700, ZOOM_STAMPA = .62, PER_RIGA = 5;

/* una pagina se ci sta; altrimenti pagine vere, ognuna con le sue linee */
function impagina() {
  scala = 1;

    disegnaLinee(); foglio.style.zoom = ZOOM_STAMPA; return;
  }
  document.body.classList.add('libro', 'pagine');
  const libro = document.createElement('div'); libro.id = 'libro'; document.body.appendChild(libro);
  const massimo = PAGINA_H / ZOOM_STAMPA;
  const pagine = [];
  const nuovaPagina = () => {
    const p = document.createElement('section'); p.className = 'pagina';
    p.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'svg')).setAttribute('class', 'linee');
    libro.appendChild(p); pagine.push(p); return p;
  };
  const griglia = (dove, quante = PER_RIGA) => {
    const g = document.createElement('div'); g.className = 'gruppi';
    g.style.gridTemplateColumns = `repeat(${quante}, 1fr)`; g.style.setProperty('--largo', quante * 330 + 'px'); dove.appendChild(g); return g;
  };
  /* un elenco troppo lungo per una pagina si divide in piu' colonne */
  const prova = griglia(nuovaPagina());
  const dividi = (col) => {
    const copia = col.cloneNode(true); prova.appendChild(copia);
    const limite = massimo * .8;
    if (copia.offsetHeight <= limite || Number(col.dataset.colonna) > 1) { copia.remove(); return [col.cloneNode(true)]; }

    voci.forEach((v, i) => {
      const h = v.offsetHeight + (voci[i + 1] && voci[i + 1].matches('.sotto') ? voci[i + 1].offsetHeight : 0);
      if (v.matches('.sotto')) { attuale.push(v); return; }
      if (attuale.length && alto + h > limite - 90) { pezzi.push(attuale); attuale = []; alto = 0; }
      attuale.push(v); alto += h;
    });
    pezzi.push(attuale);
    const risultato = pezzi.map((p, i) => {
      const nuova = col.cloneNode(true), lista = $('.voci', nuova);
      lista.innerHTML = ''; p.forEach(v => lista.appendChild(v.cloneNode(true)));
      if (i) $('.testa .et', nuova).append(' (continua)');

  let foglioP = nuovaPagina();

  colonneRami.forEach(cr => {
    const n = larghezza(cr), ultimo = scaffali[scaffali.length - 1];
    if (ultimo && ultimo.n + n <= PER_RIGA) { ultimo.rami.push(cr); ultimo.n += n; }
    else scaffali.push({ rami: [cr], n });
  });
  /* i titoli delle sezioni affiancate hanno la stessa altezza, cosi' le righe restano allineate */
  const pareggia = (dove) => {
    const teste = [...dove.querySelectorAll('.gruppi > div > .testa')];
    teste.forEach(t => { t.style.minHeight = '0px'; });
    const righe = {};
    teste.forEach(t => { (righe[t.offsetTop] = righe[t.offsetTop] || []).push(t); });
    Object.values(righe).forEach(r => { const h = Math.max(...r.map(t => t.offsetHeight)); r.forEach(t => { t.style.minHeight = h + 'px'; }); });
  };
  /* uno scaffale va sotto il precedente se ci sta intero; altrimenti comincia una pagina nuova */
  scaffali.forEach((s, i) => {
    if (i) {
      const prima = pagine.length, pagina = foglioP;
      const stacco = document.createElement('div'); stacco.className = 'stacco'; pagina.appendChild(stacco);
      mettiScaffale(s);
      if (pagine.length === prima && pagina.offsetHeight <= massimo) return;
      pagine.splice(prima).forEach(p => p.remove());
      while (stacco.nextSibling) stacco.nextSibling.remove();
      stacco.remove();
      foglioP = nuovaPagina();
    }
    mettiScaffale(s);
  });
  function mettiScaffale({ rami }) {
    if (rami.length === 1) { mettiRamo(rami[0]); return; }
    const contenitore = document.createElement('div'); contenitore.id = 'rami'; contenitore.className = 'scaffale'; foglioP.appendChild(contenitore);
    rami.forEach(cr => {
      const r = document.createElement('section'); r.className = 'ramo'; r.style.flex = `${larghezza(cr)} 1 0`; contenitore.appendChild(r);
      r.appendChild($('.scatola', cr.ramo).cloneNode(true));
      const g = griglia(r, larghezza(cr));
      cr.colonne.forEach(c => g.appendChild(c));
    });
    pareggia(contenitore);
  }
  function mettiRamo({ ramo, colonne }) {
    const contenitore = document.createElement('div'); contenitore.id = 'rami'; foglioP.appendChild(contenitore);
    const r = document.createElement('section'); r.className = 'ramo'; contenitore.appendChild(r);
    r.appendChild($('.scatola', ramo).cloneNode(true));
    const nome = [...ramo.querySelectorAll('.scatola .et .par:not(.oculta)')].map(p => p.textContent).join(' ');
    const righe = [[]]; let usate = 0;
    colonne.forEach(c => {
      const n = Number(c.dataset.colonna) || 1;
      if (usate + n > PER_RIGA) { righe.push([]); usate = 0; }
      righe[righe.length - 1].push(c); usate += n;
    });
    const quante = Math.min(PER_RIGA, colonne.reduce((n, c) => n + (Number(c.dataset.colonna) || 1), 0));
    let g = griglia(r, quante);
    righe.forEach(riga => {
      riga.forEach(c => g.appendChild(c)); pareggia(g);
      if (foglioP.offsetHeight <= massimo || g.children.length === riga.length && r.querySelector('.continua')) return;
      riga.forEach(c => c.remove());
      foglioP = nuovaPagina();
      const titolo = document.createElement('div'); titolo.className = 'continua'; titolo.textContent = nome ? nome + ' (continua)' : '(continua)';
      foglioP.appendChild(titolo);
      const seguito = document.createElement('section'); seguito.className = 'ramo'; foglioP.appendChild(seguito);
      g = griglia(seguito, quante);
      riga.forEach(c => g.appendChild(c)); pareggia(g);
    });
  }
  /* se qualcosa non si puo' dividere, si rimpicciolisce quel tanto che basta */
  const zoom = Math.min(ZOOM_STAMPA, PAGINA_H / Math.max(...pagine.map(p => p.offsetHeight)));
  pagine.forEach(p => {
    const svg = $('svg.linee', p);
    tracciaLinee(p, 1, false, true, (c, d) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d); svg.appendChild(path);
    });
    p.style.height = PAGINA_H / zoom + 'px';
    p.style.zoom = zoom;
  });
}
function disfaImpaginazione() {
  const libro = $('#libro'); if (libro) libro.remove();
  document.body.classList.remove('stampa', 'libro', 'pagine');
  foglio.style.zoom = '';
}
function prepara() {
  if (preparato) return;
  preparato = true;
  document.body.classList.add('stampa');
  document.body.classList.remove('stretto');
  document.querySelectorAll('.nodo').forEach(n => { n.classList.add('visto'); n.classList.remove('vuoto', 'corrente', 'nuovo', 'aiuto', 'immagine'); });
  collegamenti.forEach(c => { c.p.classList.add('visto'); c.p.classList.remove('nuovo'); });
  foglio.classList.remove('anima');
  foglio.style.transform = '';
  impagina();
}
function concludiStampa() {
  if (!preparato) return;
  preparato = false;
  disfaImpaginazione(); adatta(); disegna(false);
}
addEventListener('beforeprint', prepara);
addEventListener('afterprint', concludiStampa);
/* dove il browser non avvisa della fine della stampa */
addEventListener('pointerdown', concludiStampa, true);

/* comandi */
$('#m-impara').onclick = (e) => { e.stopPropagation(); avvia('impara'); };
$('#m-ripassa').onclick = (e) => { e.stopPropagation(); avvia('ripassa'); };
vista.addEventListener('click', () => { if (sopprimiClic) { sopprimiClic = false; return; } if (!pannello.hidden) { mostraPannello(false); return; } if (modo === 'stampa' || getSelection().toString()) return; avanti(); });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { mostraPannello(false); return; }
  if (pannello.contains(e.target)) return;
  if (e.key === 'ArrowRight' || (e.key === ' ' && e.target.tagName !== 'BUTTON')) { e.preventDefault(); avanti(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); indietro(); }
  else if (modo === 'ripassa' && fase === 'rivelato' && e.key.toLowerCase() === 's') valuta('si');
  else if (modo === 'ripassa' && fase === 'rivelato' && e.key.toLowerCase() === 'n') valuta('no');
});
addEventListener('resize', adatta);

costruisci();
applicaScelte();
if (window.ResizeObserver) new ResizeObserver(misuraBarra).observe($('#barra'));
avvia('impara');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(adatta);
</script>
